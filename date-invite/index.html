<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff5aa5">
  <title>با من میای سر قرار؟ 💕</title>
  <style>
    :root{
      --bg1:#fff1f7;--bg2:#f8ddff;--card:#ffffffd9;--text:#2a1730;--muted:#7d627f;
      --pink:#ff4f9a;--pink2:#ff80b9;--line:#f1c9df;--soft:#fff6fb;
    }
    *{box-sizing:border-box}
    body{
      margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;
      font-family:Tahoma,Arial,sans-serif;color:var(--text);
      background:
        radial-gradient(circle at 15% 15%,#ffd6e8 0 12%,transparent 13%),
        radial-gradient(circle at 85% 20%,#ead4ff 0 11%,transparent 12%),
        linear-gradient(145deg,var(--bg1),var(--bg2));
    }
    .wrap{width:min(100%,520px)}
    .card{
      position:relative;overflow:hidden;background:var(--card);backdrop-filter:blur(12px);
      border:1px solid #ffffff;border-radius:30px;padding:32px 22px;
      box-shadow:0 18px 60px rgba(104,45,87,.16);text-align:center;
    }
    .hearts{position:absolute;inset:0;pointer-events:none;opacity:.25}
    .hearts span{position:absolute;font-size:22px;animation:float 5s ease-in-out infinite}
    .hearts span:nth-child(1){top:7%;left:8%}.hearts span:nth-child(2){top:15%;right:10%;animation-delay:.7s}
    .hearts span:nth-child(3){bottom:12%;left:14%;animation-delay:1.4s}.hearts span:nth-child(4){bottom:8%;right:9%;animation-delay:2s}
    @keyframes float{50%{transform:translateY(-10px) rotate(8deg)}}
    .emoji{font-size:58px;margin:6px 0 14px}
    h1{font-size:clamp(25px,7vw,38px);margin:0 0 10px}
    p{margin:0;color:var(--muted);line-height:1.9}
    .actions{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;min-height:120px;margin-top:20px}
    button{
      border:0;border-radius:999px;min-height:50px;padding:13px 26px;font:inherit;font-weight:700;cursor:pointer;
      transition:.28s ease;touch-action:manipulation
    }
    #yes{
      background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff;
      box-shadow:0 8px 24px rgba(255,79,154,.3)
    }
    #no{background:#fff;color:var(--text);border:1px solid var(--line)}
    .hidden{display:none!important}
    .date-panel{margin-top:22px;text-align:right}
    label{display:block;margin:0 5px 8px;font-weight:700}
    input[type=date]{
      width:100%;min-height:52px;border:1px solid var(--line);border-radius:16px;background:#fff;
      padding:10px 14px;font:inherit;font-size:16px;color:var(--text);outline:none
    }
    input[type=date]:focus{border-color:var(--pink);box-shadow:0 0 0 3px #ff4f9a20}
    .primary{width:100%;margin-top:14px;background:linear-gradient(135deg,var(--pink),var(--pink2));color:#fff}
    .secondary{width:100%;margin-top:10px;background:#fff;border:1px solid var(--line);color:var(--text)}
    .chosen{margin-top:18px;padding:14px;border-radius:16px;background:var(--soft);line-height:1.9;font-weight:700}
    .note{font-size:12px;margin-top:12px}
    @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card" aria-live="polite">
      <div class="hearts"><span>💗</span><span>💕</span><span>💖</span><span>✨</span></div>

      <div id="askScreen">
        <div id="face" class="emoji">🥹</div>
        <h1>با من میای سر قرار؟</h1>
        <p id="hint">فقط یه سؤال ساده‌ست... جواب درست هم فقط یکیه 😌💕</p>
        <div class="actions">
          <button id="yes" type="button">آره 😍</button>
          <button id="no" type="button">نه 🙄</button>
        </div>
      </div>

      <div id="dateScreen" class="hidden">
        <div class="emoji">🥰</div>
        <h1>می‌دونستم آره میگی 😌</h1>
        <p>حالا تاریخ قرار رو مشخص کن 💕</p>
        <form id="dateForm" class="date-panel">
          <label for="dateInput">کی بریم بیرون؟ 📅</label>
          <input id="dateInput" type="date" required>
          <button id="submitDate" class="primary" type="submit">ثبت تاریخ و ارسال خودکار 💌</button>
        </form>
      </div>

      <div id="doneScreen" class="hidden">
        <div class="emoji">🤭</div>
        <h1>پس قرارمون قطعی شد! 💕</h1>
        <div id="chosen" class="chosen"></div>
        <p id="deliveryStatus" class="note" role="status" aria-live="polite"></p>
        <button id="sendSms" class="secondary hidden" type="button">ارسال دستی پیامک (در صورت نیاز) 💌</button>
        <button id="restart" class="secondary" type="button">از اول 😄</button>
        <p class="note">تاریخ بعد از ثبت، خودکار برای طرف مقابل ارسال می‌شود؛ فقط در صورت خطا دکمه ارسال دستی نمایش داده می‌شود.</p>
      </div>
    </section>
  </main>

<script>
(() => {
  const targetPhone = '+989160607426';
  const yes = document.getElementById('yes');
  const no = document.getElementById('no');
  const hint = document.getElementById('hint');
  const face = document.getElementById('face');
  const ask = document.getElementById('askScreen');
  const dateScreen = document.getElementById('dateScreen');
  const done = document.getElementById('doneScreen');
  const form = document.getElementById('dateForm');
  const input = document.getElementById('dateInput');
  const chosen = document.getElementById('chosen');
  const sendSms = document.getElementById('sendSms');
  const submitDate = document.getElementById('submitDate');
  const deliveryStatus = document.getElementById('deliveryStatus');
  const restart = document.getElementById('restart');
  let clicks = 0;
  let selectedDate = '';

  const msgs = [
    'مطمئنی؟ 🥺',
    'یه بار دیگه فکر کن 😭',
    'یعنی واقعاً نه؟ 💔',
    'دلت میاد؟ 🥹',
    'اون آره خیلی قشنگ‌تره 😌',
    'دیگه داری گزینه‌هات رو کم می‌کنی 😂',
    'خب... دیگه فقط یه گزینه مونده 😈💕'
  ];
  const faces = ['🥺','😭','😔','🥹','🤨','😈','😂'];

  const today = new Date();
  const yyyy = today.getFullYear();
  const mm = String(today.getMonth()+1).padStart(2,'0');
  const dd = String(today.getDate()).padStart(2,'0');
  input.min = `${yyyy}-${mm}-${dd}`;

  no.addEventListener('click', () => {
    clicks++;
    const i = Math.min(clicks-1,msgs.length-1);
    hint.textContent = msgs[i];
    face.textContent = faces[i];
    const yesScale = Math.min(1 + clicks * 0.22, 2.5);
    const noScale = Math.max(0.35, 1 - clicks * 0.1);
    yes.style.transform = `scale(${yesScale})`;
    yes.style.padding = `${13 + clicks*2}px ${26 + clicks*6}px`;
    no.style.transform = `scale(${noScale})`;
    no.style.opacity = String(Math.max(0.15,1-clicks*0.13));

    if (clicks >= 7) {
      no.classList.add('hidden');
      yes.style.transform = 'scale(1)';
      yes.style.width = '100%';
      yes.style.fontSize = '24px';
      yes.textContent = 'باشه بابا، آره 😍💕';
    }
  });

  yes.addEventListener('click', () => {
    ask.classList.add('hidden');
    dateScreen.classList.remove('hidden');
    input.focus();
  });

  form.addEventListener('submit', async e => {
    e.preventDefault();
    if (!input.value) return;
    selectedDate = input.value;
    const [y,m,d] = selectedDate.split('-').map(Number);
    const dt = new Date(Date.UTC(y,m-1,d));
    const persian = new Intl.DateTimeFormat('fa-IR-u-ca-persian',{
      weekday:'long',year:'numeric',month:'long',day:'numeric',timeZone:'UTC'
    }).format(dt);
    const gregorian = new Intl.DateTimeFormat('fa-IR',{
      year:'numeric',month:'long',day:'numeric',timeZone:'UTC'
    }).format(dt);
    chosen.innerHTML = '📅 ' + persian + '<br><span style="font-weight:400;color:#7d627f">(' + gregorian + ')</span>';
    dateScreen.classList.add('hidden');
    done.classList.remove('hidden');
    deliveryStatus.textContent = 'در حال ارسال خودکار تاریخ... لطفاً صبر کن 💌';
    deliveryStatus.style.color = '#7d627f';
    sendSms.classList.add('hidden');
    submitDate.disabled = true;
    try {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 65000);
      let response;
      try {
        response = await fetch('https://amin-date-invite-sms.onrender.com/api/date', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ date: selectedDate }),
          signal: controller.signal,
        });
      } finally {
        clearTimeout(timer);
      }
      const result = await response.json().catch(() => ({}));
      if (!response.ok || !result.ok) throw new Error(result.error || 'ارسال خودکار ممکن نشد.');
      deliveryStatus.style.color = '#217148';
      deliveryStatus.textContent = 'درخواست ارسال پیامک به سامانه ثبت شد ✅';
    } catch (error) {
      deliveryStatus.style.color = '#a83558';
      deliveryStatus.textContent = 'ارسال خودکار انجام نشد. ' + (error.message || 'لطفاً دوباره تلاش کن.');
      sendSms.classList.remove('hidden');
    } finally {
      submitDate.disabled = false;
    }
  });

  sendSms.addEventListener('click', () => {
    if (!selectedDate) return;
    const [y,m,d] = selectedDate.split('-').map(Number);
    const dt = new Date(Date.UTC(y,m-1,d));
    const persian = new Intl.DateTimeFormat('fa-IR-u-ca-persian',{
      weekday:'long',year:'numeric',month:'long',day:'numeric',timeZone:'UTC'
    }).format(dt);
    const text = 'آره 😊 برای قرار موافقم! تاریخ پیشنهادی من: ' + persian + ' 💕';
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    const sep = isIOS ? '&' : '?';
    location.href = 'sms:' + targetPhone + sep + 'body=' + encodeURIComponent(text);
  });

  restart.addEventListener('click', () => {
    clicks = 0; selectedDate = ''; input.value = ''; deliveryStatus.textContent = '';
    done.classList.add('hidden'); dateScreen.classList.add('hidden'); ask.classList.remove('hidden');
    face.textContent = '🥹'; hint.textContent = 'فقط یه سؤال ساده‌ست... جواب درست هم فقط یکیه 😌💕';
    yes.removeAttribute('style'); yes.textContent = 'آره 😍';
    no.removeAttribute('style'); no.classList.remove('hidden');
  });
})();
</script>
</body>
</html>
